services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ✅ ContentFixtures (pour qu'elle soit bien exécutée)
    App\DataFixtures\ORM\ContentFixtures:
        tags: ['doctrine.fixture.orm']

    # 🎯 DiagnosticDataPersister
    App\DataPersister\DiagnosticDataPersister:
        decorates: 'api_platform.doctrine.orm.state.persist_processor'
        arguments:
            $persistProcessor: '@App\DataPersister\DiagnosticDataPersister.inner'
            $security: '@security.helper'
        autoconfigure: false
        public: false

    # 🎯 EmotionEntryDataPersister
    App\DataPersister\EmotionEntryDataPersister:
        decorates: 'App\DataPersister\DiagnosticDataPersister'
        arguments:
            $inner: '@App\DataPersister\EmotionEntryDataPersister.inner'
            $security: '@security.helper'
        autoconfigure: false
        public: false

    # 🎯 UserOwnedDataPersister
    App\DataPersister\UserOwnedDataPersister:
        decorates: 'App\DataPersister\EmotionEntryDataPersister'
        arguments:
            $inner: '@App\DataPersister\UserOwnedDataPersister.inner'
            $security: '@security.helper'
        autoconfigure: false
        public: false

    # ✅ DiagnosticSubmissionDataPersister
    App\DataPersister\DiagnosticSubmissionDataPersister:
        decorates: 'api_platform.doctrine.orm.state.persist_processor'
        arguments:
            $persistProcessor: '@App\DataPersister\DiagnosticSubmissionDataPersister.inner'
            $security: '@security.helper'
        autoconfigure: false
        public: false

    # ✅ UserDataPersister (hash mot de passe)
    App\DataPersister\UserDataPersister:
        decorates: 'api_platform.doctrine.orm.state.persist_processor'
        arguments:
            $persistProcessor: '@App\DataPersister\UserDataPersister.inner'
            $passwordHasher: '@security.user_password_hasher'
        autoconfigure: false
        public: false

    # ✅ ExerciseUserFilterExtension (filtrage auto par utilisateur connecté)
    App\Doctrine\Extension\ExerciseUserFilterExtension:
        tags:
            - 'api_platform.doctrine.orm.query_extension.collection'
            - 'api_platform.doctrine.orm.query_extension.item'
        arguments:
            $security: '@security.helper'
