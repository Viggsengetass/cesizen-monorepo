services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # Persister spécifique pour EmotionEntry (DOIT être le décorateur principal)
    App\DataPersister\EmotionEntryDataPersister:
        decorates: 'api_platform.doctrine.orm.state.persist_processor'
        arguments:
            $inner: '@App\DataPersister\EmotionEntryDataPersister.inner'
            $security: '@security.helper'
        autoconfigure: false
        public: false

    # Persister générique
    App\DataPersister\UserOwnedDataPersister:
        decorates: 'App\DataPersister\EmotionEntryDataPersister'
        arguments:
            $inner: '@App\DataPersister\UserOwnedDataPersister.inner'
            $security: '@security.helper'
        autoconfigure: false
        public: false
