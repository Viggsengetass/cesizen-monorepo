name: Mobile CI

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  mobile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install PNPM
        run: corepack enable

      - name: Install dependencies
        run: |
          cd apps/mobile
          pnpm install

      - name: Run Expo Doctor (vérification basique)
        run: |
          cd apps/mobile
          npx expo doctor
